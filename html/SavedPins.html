  <title>Сохраненные пинкоды</title>
  <style>
    @font-face { font-family: "Roboto-Bold"; font-weight: 700; src: url(font/Roboto-Bold_1.ttf) format(truetype); }
    @font-face { font-family: "Roboto-Medium"; font-weight: 500; src: url(font/Roboto-Medium_1.ttf) format(truetype); }
    @font-face { font-family: "Roboto-Regular"; font-weight: 400; src: url(font/Roboto-Regular_1.ttf) format(truetype); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100%; background: #fefefe; color: #222; }
    .screen { width: 22.5rem; margin: 0 auto; padding: 0 1.25rem 5.5rem; }
    h1 { font-family: "Roboto-Bold", sans-serif; font-size: 1.375rem; line-height: 1.5rem; margin-top: 0.5rem; }
    .hint { margin-top: 1rem; font-family: "Roboto-Regular", sans-serif; font-size: 0.875rem; line-height: 1.2rem; color: #393939; }
    .field { margin-top: 1rem; width: 100%; height: 3rem; border: 0.125rem solid #222; border-radius: 0.625rem; padding: 0 0.875rem; font-family: "Roboto-Medium", sans-serif; font-size: 1.125rem; letter-spacing: 0.12rem; color: #222; background: #fff; }
    .status { margin-top: 0.75rem; min-height: 1.25rem; font-family: "Roboto-Medium", sans-serif; font-size: 0.875rem; line-height: 1.25rem; color: #222; }
    .save { margin-top: 1.25rem; width: 100%; height: 3rem; border-radius: 0.625rem; background: rgb(55, 90, 118); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .save p { font-family: "Roboto-Bold", sans-serif; font-size: 1rem; color: #fefefe; }
    .tabbar { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; width: 22.5rem; height: 4.25rem; margin: 0 auto; background: #fefefe; border-top: 0.0625rem solid #000; display: flex; align-items: center; justify-content: space-around; }
    .tab { width: 3.625rem; height: 3.625rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; }
    .tab img { width: 1.875rem; height: 1.875rem; object-fit: contain; }
    .tab p { font-family: "Roboto-Bold", sans-serif; font-size: 0.625rem; line-height: 0.75rem; text-align: center; }
    .tab.on { background: #f1f1f1; }
  </style>
  <link rel="stylesheet" href="fit.css?v=12">
</head>
<body>

    <div style="position: absolute; left: 18.125rem; top: 2.1875rem; width: 3.125rem; height: 3.1875rem;">
      <div style="width: 1.7917rem; height: 1.7917rem; position: absolute; left: 0.6875rem; top: 0.6875rem; background-image: url(./image/953999f3aefcce454ce665b5493f1ae4d5842efd.png); background-size: cover;"></div>

  </div>
  <div class="screen">
    <h1>Сохраненные пинкоды</h1>
    <p class="hint">PIN для первичного подключения к протезу. Код хранится в этом браузере и подставляется в подсказку при подключении.</p>
    <input id="vega-pin-input" class="field" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="123456">
    <p id="vega-pin-status" class="status"></p>
    <div class="save"><p>Сохранить</p></div>
  </div>
